      }
      .word-wrapper:hover .word-text {

      .tooltip {
        visibility: hidden;
        width: 300px;
        background: #1e293b;
        color: white;
        border-radius: 8px;
        padding: 16px;
        position: absolute;
        z-index: 1100;
        bottom: 130%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.3s;
        border: 1px solid #334155;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        font-size: 0.9em;
        pointer-events: none;
      }
      .tooltip.active {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
      }
      .tooltip.flip {
        bottom: auto;
        top: 130%;
      }
      .tooltip.flip::after {
        top: auto;
        bottom: 100%;
        border-color: transparent transparent #1e293b transparent;
      }
      .tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -8px;
        border-width: 8px;
        border-style: solid;
        border-color: #1e293b transparent transparent transparent;
      }
      .tt-close {
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 1.2em;
        padding: 0;
        line-height: 1;
      }
      .tt-close:hover {
        color: white;
      }
      .play-pronunciation {

        border: none;
        color: #34d399;

        background: #334155;
      }

        padding-bottom: 8px;
        margin-bottom: 10px;

        font-size: 0.8em;
        font-weight: 600;
        color: #34d399;
      }

        color: #94a3b8;
        margin: 0 0 2px 0;

        margin: 0 0 10px 0;
        font-weight: 500;
        color: #6ee7b7;

      }

        font-size: 0.7em;
        margin: 0;

        height: 50px;

        color: white;
        font-weight: bold;
        transition: 0.3s;

      .status {
        font-size: 0.85em;
        color: #7f8c8d;
        display: flex;
        align-items: center;
        gap: 8px;
      }

        width: 8px;
        height: 8px;
        background: #e74c3c;
        border-radius: 50%;
        display: none;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 6px rgba(231, 76, 60, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0);
        }

        flex-grow: 1;
        accent-color: #e74c3c;
        cursor: pointer;
        height: 6px;
      }

        accent-color: var(--primary);

        height: 6px;
      }

        font-size: 0.9em;

        text-align: right;

        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }
      .word-cell {
        perspective: 1000px;
        height: 100px;
        cursor: pointer;
      }

        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        transform-style: preserve-3d;
      }
      .word-cell.flipped .word-cell-inner {
        transform: rotateY(180deg);
      }
      .word-cell-front,
      .word-cell-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-sizing: border-box;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);

        background: #f0f4f8;
        color: var(--primary);
        font-size: 1.4em;
        font-weight: 500;
      }
      .word-cell-back {
        background: var(--primary);
        color: white;
        transform: rotateY(180deg);

        font-style: italic;

        grid-template-columns: 1fr 1fr;

        font-size: 1.1em;

        border-radius: 10px;
        background: white;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }
      .option-btn:hover:not(:disabled) {
        border-color: var(--accent);
        background: #f0fff4;
      }
      .option-btn.correct {
        background: #27ae60;
        color: white;
        border-color: #27ae60;
      }
      .option-btn.incorrect {
        background: #e74c3c;
        color: white;
        border-color: #e74c3c;
      }
      .option-btn:disabled {
        cursor: default;
      }
      .feedback-area {
        margin-top: 20px;
        text-align: center;
        min-height: 50px;
        font-weight: bold;
      }
      .result-screen {
        text-align: center;
        padding: 40px;
      }
      .result-score {
        font-size: 4em;
        color: var(--accent);
        font-weight: bold;
        margin: 20px 0;

      .retry-btn {
        background: var(--primary);

        border: none;

        border-radius: 25px;
        font-size: 1.1em;
        cursor: pointer;
        margin-top: 20px;
      }
      .retry-btn:hover {
        background: #34495e;
      }
      @media (max-width: 600px) {

      /* Tajwid Coloring */

      }
      .qalaqah {
        color: #dd0008; /* Red */
      }
      .ikhafa {
        color: #9400a8; /* Purple */
      }
    </style>

            },
            {
              a: "وَلَا",
              t: "Walā",
              m: "dan bukan",
              e: "nor",
              p: "Waw from lips, Lam from tongue",
            },
            {
              // a: "ٱلضَّآلِّينَ",
              a: `<span class="ham_wasl">ٱ</span><span class="laam_shamsiyah">ل</span>ضّ<span class="madda_necessary">َا</span>ٓلّ<span class="madda_permissible">ِي</span>نَ <span class="end">٧</span>`,
              t: "Aḍ-Ḍāllīn",
              m: "yang sesat",
              e: "those who go astray",
              p: "Ḍad from tongue side, Lam from tongue",
            },
          ],
        },
        Ruku: {
          title: "Ruku' (Bowing)",
          arabic: "سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ",
          fullTrans: "Glory be to my Lord the Supreme, and by His praise.",
          audio: "ruku.mp3",
          words: [
            {
              a: "سُبْحَانَ",
              t: "Subhana",
              m: "Maha Suci",
              e: "Glory be",
              p: "S",
            },
            { a: "رَبِّيَ", t: "Rabbiya", m: "Tuhanku", e: "my Lord", p: "R" },
            {
              a: "الْعَظِيمِ",
              t: "Al-Azim",
              m: "Maha Agung",
              e: "the Supreme",
              p: "A",
            },
          ],
        },
        Sajdah: {
          title: "Sajdah (Prostration)",
          arabic: "سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ",
          fullTrans: "Glory be to my Lord the Most High, and by His praise.",
          audio: "ruku.mp3",
          words: [
            {
              a: "الْأَعْلَى",
              t: "Al-A'la",
              m: "Maha Tinggi",
              e: "the Most High",
              p: "A",
            },
          ],
        },
      };

      let quizState = {
        questions: [],
        currentIndex: 0,
        score: 0,
        canAnswer: true,
      };

      function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec.toString().padStart(2, "0")}`;
      }

      // Keep a reference outside the function
      let currentAudio = null;

      function renderPlayer(wrapper, sec) {
        // Cleanup previous audio instance to prevent memory leaks
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.onended = null;
          currentAudio.ontimeupdate = null;
          currentAudio.src = ""; // release
          currentAudio = null;
        }

        const audio = new Audio(sec.audio);
        currentAudio = audio;
        const duration = sec.words.length * 2.5;
        wrapper.innerHTML = `
                <div class="controls">
                    <button class="play-pause-btn">▶</button>
                    <input type="range" class="seek-bar" value="0" min="0" max="${duration}" step="0.1">
                    <span class="time-display">0:00 / ${formatTime(duration)}</span>
                    <input type="range" class="volume-bar" min="0" max="1" step="0.01" value="1">
                </div>
                <div class="status"><div class="pulsing"></div> <span>Ready</span></div>
            `;
        const btn = wrapper.querySelector(".play-pause-btn");
        const seek = wrapper.querySelector(".seek-bar");
        const timeDisp = wrapper.querySelector(".time-display");
        const pulse = wrapper.querySelector(".pulsing");
        const statusText = wrapper.querySelector(".status span");
        const volumeBar = wrapper.querySelector(".volume-bar");

        audio.volume = volumeBar.value; // Set initial volume

        audio.onended = () => {
          btn.classList.remove("playing");
          btn.innerText = "▶";
          pulse.style.display = "none";
          statusText.innerText = "Ready";
          seek.value = 0;
        };
        audio.ontimeupdate = () => {
          seek.value = audio.currentTime;
          timeDisp.innerText = `${formatTime(audio.currentTime)} / ${formatTime(duration)}`;
        };
        seek.oninput = (e) => (audio.currentTime = e.target.value);
        volumeBar.oninput = (e) => (audio.volume = e.target.value); // Volume control
        btn.onclick = () => {
          if (audio.paused) {
            audio.play();
            btn.classList.add("playing");
            btn.innerText = "II";
            pulse.style.display = "block";
            statusText.innerText = "Now Playing";
          } else {
            audio.pause();
            btn.classList.remove("playing");
            btn.innerText = "▶";
            pulse.style.display = "none";
            statusText.innerText = "Paused";
          }
        };
      }

      // Keep a reference outside the function
      let wordAudio = null;

      function playWordAudio() {
        // If an audio instance already exists, stop and release it
        if (wordAudio) {
          wordAudio.pause();
          wordAudio.src = ""; // release the resource
          wordAudio = null;
        }
        // Create a new audio instance
        wordAudio = new Audio("pronounce.mp3");
        wordAudio.play();
      }

      function initQuiz() {
        const allWords = [];
        Object.values(sections).forEach((sec) => {
          sec.words.forEach((w) => {
            allWords.push({ ...w, sectionTitle: sec.title });
          });
        });

        // Shuffle and pick 10
        const shuffled = allWords.sort(() => 0.5 - Math.random());
        quizState.questions = shuffled.slice(0, 10).map((word) => {
          const options = [word.m];
          const distractors = allWords
            .filter((w) => w.m !== word.m)
            .map((w) => w.m);
          const uniqueDistractors = [...new Set(distractors)];

          while (options.length < 4 && uniqueDistractors.length > 0) {
            const idx = Math.floor(Math.random() * uniqueDistractors.length);
            options.push(uniqueDistractors.splice(idx, 1)[0]);
          }

          return {
            ...word,
            options: options.sort(() => 0.5 - Math.random()),
          };
        });

        quizState.currentIndex = 0;
        quizState.score = 0;
        quizState.canAnswer = true;
        renderQuiz();
      }

      function renderQuiz() {
        const container = document.getElementById("sections");
        const q = quizState.questions[quizState.currentIndex];
        const progress =
          ((quizState.currentIndex + 1) / quizState.questions.length) * 100;

        container.innerHTML = `
                <div class="quiz-container">
                  <div class="quiz-header">
                    <span>Question ${quizState.currentIndex + 1} of ${quizState.questions.length}</span>
                    <div class="progress-container">
                      <div class="progress-bar" style="width: ${progress}%"></div>
                    </div>
                    <span>Score: ${quizState.score}</span>
                  </div>
                  <div class="question-card">
                    <div class="question-arabic">${q.a}</div>
                    <div class="question-trans">${q.t}</div>
                    <p>What is the meaning of this word?</p>
                  </div>
                  <div class="options-grid">
                    ${q.options
                      .map(
                        (opt, i) => `
                      <button class="option-btn" onclick="checkAnswer(${i})">${opt}</button>
                    `,
                      )
                      .join("")}
                  </div>
                  <div class="feedback-area" id="feedback"></div>
                </div>
              `;
      }

      function checkAnswer(idx) {
        if (!quizState.canAnswer) return;
        quizState.canAnswer = false;

        const q = quizState.questions[quizState.currentIndex];
        const selected = q.options[idx];
        const buttons = document.querySelectorAll(".option-btn");
        const feedback = document.getElementById("feedback");

        if (selected === q.m) {
          quizState.score++;
          buttons[idx].classList.add("correct");
          feedback.innerHTML = `<span style="color: var(--accent)">✨ Correct! ${q.a} means ${q.m}.</span>`;
        } else {
          buttons[idx].classList.add("incorrect");
          // Find correct one
          buttons.forEach((btn, i) => {
            if (q.options[i] === q.m) btn.classList.add("correct");
          });
          feedback.innerHTML = `<span style="color: #e74c3c">❌ Incorrect. ${q.a} means ${q.m}.</span>`;
        }

        setTimeout(() => {
          quizState.currentIndex++;
          if (quizState.currentIndex < quizState.questions.length) {
            quizState.canAnswer = true;
            renderQuiz();
          } else {
            showResults();
          }
        }, 2000);
      }

      function showResults() {
        const container = document.getElementById("sections");
        const percentage = Math.round(
          (quizState.score / quizState.questions.length) * 100,
        );
        let message = "Excellent! You have a great grasp of the meanings.";
        if (percentage < 80) message = "Good job! Keep practicing to improve.";
        if (percentage < 50) message = "Keep learning! Consistency is key.";

        container.innerHTML = `
                <div class="card result-screen">
                  <h2>Quiz Completed!</h2>
                  <div class="result-score">${percentage}%</div>
                  <p>You scored ${quizState.score} out of ${quizState.questions.length}</p>
                  <p>${message}</p>
                  <button class="retry-btn" onclick="initQuiz()">Try Again</button>
                </div>
              `;
      }

      function render(key) {
        const container = document.getElementById("sections");
        if (key === "quiz") {
          initQuiz();
        } else {
          const sec = sections[key];
          container.innerHTML = `
                          <div class="card">
                              <h2>${sec.title}</h2>
                              <div class="arabic-text">
          ${sec.words
            .map(
              (w) => `<span class="word-wrapper" onclick="toggleTooltip(event)">
                      <span class="word-text">${w.a}</span>
                      <div class="tooltip">
                          <div class="tt-header">
                              <button class="tt-close" onclick="closeTooltip(event)">×</button>
                              <span class="tt-title" style="margin-left: 10px; flex: 1;">Pronunciation</span>
                              <button class="play-pronunciation" onclick="playWordAudio()">
                                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                              </button>
                          </div>
                          <p class="tt-label">Transliteration:</p>
                          <p class="tt-val">${w.t}</p>
                          <div class="tt-grid">
                              <div class="tt-grid-item"><p class="tt-label">🇬🇧 English:</p><p class="tt-val-sm">${w.e}</p></div>
                              <div class="tt-grid-item"><p class="tt-label">🇲🇾 Melayu:</p><p class="tt-val-sm">${w.m}</p></div>
                          </div>
                          <p class="tt-label">Makhraj Guide:</p>
                          <p class="tt-guide">${w.p}</p>
                      </div>
                  </span>`,
            )
            .join(" ")}
      </div>
                              <div class="audio-player-wrapper"></div>
                              <p><strong>Translation:</strong> ${sec.fullTrans}</p>
                              <p style="text-align: center; font-size: 0.85em; color: #7f8c8d; margin: 20px 0 0 0;">
                                  💡 Tip: Click the cards below to flip and see meanings!
                              </p>
                              <div class="grid">
                                  ${sec.words
                                    .map(
                                      (w) => `
                                      <div class="word-cell" onclick="this.classList.toggle('flipped')">
                                          <div class="word-cell-inner">
                                              <div class="word-cell-front">
                                                  <span>${w.a}</span>
                                              </div>
                                              <div class="word-cell-back">
                                                  <small><strong>EN:</strong> ${w.e}<br><strong>MY:</strong> ${w.m}</small>
                                              </div>
                                          </div>
                                      </div>
                                  `,
                                    )
                                    .join("")}
                              </div>
                          </div>
                      `;
          renderPlayer(container.querySelector(".audio-player-wrapper"), sec);
        }
        document
          .querySelectorAll(".nav-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document.getElementById("btn-" + key).classList.add("active");
      }

      function toggleTooltip(e) {
        document
          .querySelectorAll(".tooltip")
          .forEach((t) => t.classList.remove("active", "flip"));
        const tooltip = e.currentTarget.querySelector(".tooltip");
        tooltip.classList.add("active");

        const rect = tooltip.getBoundingClientRect();
        if (rect.top < 0) {
          tooltip.classList.add("flip");
        }
        e.stopPropagation();
      }

      function closeTooltip(e) {
        e.currentTarget.closest(".tooltip").classList.remove("active");
        e.stopPropagation();
      }

      const nav = document.getElementById("nav");
      Object.keys(sections).forEach((key) => {
        const btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.id = "btn-" + key;
        btn.innerText = key;
        btn.onclick = () => render(key);
        nav.appendChild(btn);
      });
      const qBtn = document.createElement("button");
      qBtn.className = "nav-btn";
      qBtn.id = "btn-quiz";
      qBtn.innerText = "Quiz Mode";
      qBtn.onclick = () => render("quiz");
      nav.appendChild(qBtn);

      function closeBanner() {
        document.getElementById("dev-banner").style.display = "none";
      }

      render("Takbir");
    </script>
  </body>
</html>
