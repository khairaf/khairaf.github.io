<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Salat Fajr Recitation Guide</title>
    <style>
      :root {
        --primary: #2c3e50;
        --accent: #27ae60;
        --bg: #f9f9fb;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
        background: var(--bg);
        color: #333;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }
      h2 {
        color: var(--primary);
        margin-top: 0;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
      }
      .arabic-text {
        font-size: 2.5em;
        direction: rtl;
        margin: 15px 0;
      }
      .word-wrapper {
        position: relative;
        display: inline-block;
        cursor: pointer;
        margin: 0 5px;
      }
      .word-text {
        font-size: 1.2em;
        color: var(--primary);
        transition: color 0.3s;
      }
      .word-wrapper:hover .word-text {
        color: var(--accent);
      }
      .tooltip {
        visibility: hidden;
        width: 300px;
        background: #1e293b;
        color: white;
        border-radius: 8px;
        padding: 16px;
        position: absolute;
        z-index: 50;
        bottom: 130%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.3s;
        border: 1px solid #334155;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        font-size: 0.9em;
        pointer-events: none;
      }
      .tooltip.active {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
      }
      .tooltip.flip {
        bottom: auto;
        top: 130%;
      }
      .tooltip.flip::after {
        top: auto;
        bottom: 100%;
        border-color: transparent transparent #1e293b transparent;
      }
      .tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -8px;
        border-width: 8px;
        border-style: solid;
        border-color: #1e293b transparent transparent transparent;
      }
      .tt-close {
        position: absolute;
        top: 8px;
        right: 8px;
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 1.2em;
      }
      .tt-close:hover {
        color: white;
      }
      .play-pronunciation {
        background: none;
        border: none;
        color: #34d399;
        cursor: pointer;
        padding: 4px;
        border-radius: 50%;
        transition: background 0.3s;
      }
      .play-pronunciation:hover {
        background: #334155;
      }
      .tt-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #475569;
        padding-bottom: 8px;
        margin-bottom: 10px;
      }
      .tt-title {
        font-size: 0.8em;
        font-weight: 600;
        color: #34d399;
      }
      .tt-label {
        font-size: 0.44em;
        color: #94a3b8;
        margin: 0 0 2px 0;
      }
      .tt-val {
        font-size: 0.8em;
        margin: 0 0 10px 0;
        font-weight: 500;
        color: #6ee7b7;
      }
      .tt-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .tt-grid-item {
        margin: 0;
      }
      .tt-val-sm {
        font-size: 0.7em;
        margin: 0;
        color: #fff;
      }
      .tt-guide {
        font-size: 0.4em;
        margin: 0;
        font-style: italic;
        color: #cbd5e1;
      }
      .audio-player-wrapper {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 12px;
        margin: 15px 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .play-pause-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        color: white;
        font-weight: bold;
        transition: 0.3s;
        background: linear-gradient(135deg, #27ae60, #2ecc71);
      }
      .play-pause-btn.playing {
        background: linear-gradient(135deg, #c0392b, #e74c3c);
      }
      .status {
        font-size: 0.85em;
        color: #7f8c8d;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pulsing {
        width: 8px;
        height: 8px;
        background: #e74c3c;
        border-radius: 50%;
        display: none;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 6px rgba(231, 76, 60, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0);
        }
      }
      .seek-bar {
        flex-grow: 1;
        accent-color: #e74c3c;
        cursor: pointer;
        height: 6px;
      }
      .time-display {
        font-family: monospace;
        font-size: 0.9em;
        min-width: 80px;
        text-align: right;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 15px;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }
      .word-cell {
        text-align: center;
        background: #f0f4f8;
        padding: 10px;
        border-radius: 8px;
        font-size: 0.9em;
      }
      .nav-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        justify-content: center;
      }
      .nav-btn {
        background: #eee;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.3s;
      }
      .nav-btn.active {
        background: var(--primary);
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Salat Fajr Recitation Guide</h1>
    <div id="nav" class="nav-bar"></div>
    <div id="sections"></div>

    <script>
      const sections = {
        Takbir: {
          title: "Takbiratul Ihram",
          arabic: "الله أكبر",
          fullTrans: "Allah is the Greatest.",
          audio: "ruku.mp3",
          words: [
            {
              a: "الله",
              t: "Allahu",
              m: "God",
              p: "Start from throat, clear 'A', followed by double 'L' with tongue tip touching upper palate",
            },
            { a: "أكبر", t: "Akbar", m: "Greater", p: "Throat" },
          ],
        },
        Fatihah: {
          title: "Surah Al-Fatihah",
          arabic: "الحمد لله",
          fullTrans: "All praise is due to Allah.",
          audio: "ruku.mp3",
          words: [
            { a: "الحمد", t: "Alhamdu", m: "Praise", p: "Throat" },
            { a: "لله", t: "Lillahi", m: "to Allah", p: "Throat" },
          ],
        },
      };

      function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec.toString().padStart(2, "0")}`;
      }

      function renderPlayer(wrapper, sec) {
        const audio = new Audio(sec.audio);
        const duration = sec.words.length * 2.5;
        wrapper.innerHTML = `
                <div class="controls">
                    <button class="play-pause-btn">▶</button>
                    <input type="range" class="seek-bar" value="0" min="0" max="${duration}" step="0.1">
                    <span class="time-display">0:00 / ${formatTime(duration)}</span>
                </div>
                <div class="status"><div class="pulsing"></div> <span>Ready</span></div>
            `;
        const btn = wrapper.querySelector(".play-pause-btn");
        const seek = wrapper.querySelector(".seek-bar");
        const timeDisp = wrapper.querySelector(".time-display");
        const pulse = wrapper.querySelector(".pulsing");
        const statusText = wrapper.querySelector(".status span");

        audio.onended = () => {
          btn.classList.remove("playing");
          btn.innerText = "▶";
          pulse.style.display = "none";
          statusText.innerText = "Ready";
          seek.value = 0;
        };
        audio.ontimeupdate = () => {
          seek.value = audio.currentTime;
          timeDisp.innerText = `${formatTime(audio.currentTime)} / ${formatTime(duration)}`;
        };
        seek.oninput = (e) => (audio.currentTime = e.target.value);
        btn.onclick = () => {
          if (audio.paused) {
            audio.play();
            btn.classList.add("playing");
            btn.innerText = "II";
            pulse.style.display = "block";
            statusText.innerText = "Now Playing";
          } else {
            audio.pause();
            btn.classList.remove("playing");
            btn.innerText = "▶";
            pulse.style.display = "none";
            statusText.innerText = "Paused";
          }
        };
      }

      function playWordAudio() {
        new Audio("pronounce.mp3").play();
      }

      function render(key) {
        const container = document.getElementById("sections");
        if (key === "quiz") {
          container.innerHTML =
            '<div class="card"><h2>Practice Mode</h2><p>Guess the meaning!</p></div>';
        } else {
          const sec = sections[key];
          container.innerHTML = `
                    <div class="card">
                        <h2>${sec.title}</h2>
                        <div class="arabic-text">
                            ${sec.words
                              .map(
                                (
                                  w,
                                ) => `<span class="word-wrapper" onclick="toggleTooltip(event)">
                                <span class="word-text">${w.a}</span>
                                <div class="tooltip">
                                    <button class="tt-close" onclick="closeTooltip(event)">×</button>
                                    <div class="tt-header">
                                        <span class="tt-title">Pronunciation</span>
                                        <button class="play-pronunciation" onclick="playWordAudio()">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                                        </button>
                                    </div>
                                    <p class="tt-label">Transliteration:</p>
                                    <p class="tt-val">${w.t}</p>
                                    <div class="tt-grid">
                                        <div class="tt-grid-item"><p class="tt-label">🇬🇧 English:</p><p class="tt-val-sm">${w.m}</p></div>
                                        <div class="tt-grid-item"><p class="tt-label">🇲🇾 Melayu:</p><p class="tt-val-sm">${w.m}</p></div>
                                    </div>
                                    <p class="tt-label">Makhraj Guide:</p>
                                    <p class="tt-guide">${w.p}</p>
                                </div>
                            </span>`,
                              )
                              .join(" ")}
                        </div>
                        <div class="audio-player-wrapper"></div>
                        <p><strong>Translation:</strong> ${sec.fullTrans}</p>
                        <div class="grid">
                            ${sec.words.map((w) => `<div class="word-cell">${w.a}<br><small>${w.t}</small></div>`).join("")}
                        </div>
                    </div>
                `;
          renderPlayer(container.querySelector(".audio-player-wrapper"), sec);
        }
        document
          .querySelectorAll(".nav-btn")
          .forEach((btn) => btn.classList.remove("active"));
        document.getElementById("btn-" + key).classList.add("active");
      }

      function toggleTooltip(e) {
        document
          .querySelectorAll(".tooltip")
          .forEach((t) => t.classList.remove("active", "flip"));
        const tooltip = e.currentTarget.querySelector(".tooltip");
        tooltip.classList.add("active");

        const rect = tooltip.getBoundingClientRect();
        if (rect.top < 0) {
          tooltip.classList.add("flip");
        }
        e.stopPropagation();
      }

      function closeTooltip(e) {
        e.currentTarget.parentElement.classList.remove("active");
        e.stopPropagation();
      }

      const nav = document.getElementById("nav");
      Object.keys(sections).forEach((key) => {
        const btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.id = "btn-" + key;
        btn.innerText = key;
        btn.onclick = () => render(key);
        nav.appendChild(btn);
      });
      const qBtn = document.createElement("button");
      qBtn.className = "nav-btn";
      qBtn.id = "btn-quiz";
      qBtn.innerText = "Quiz Mode";
      qBtn.onclick = () => render("quiz");
      nav.appendChild(qBtn);

      function check() {
        alert("Feature coming soon!");
      }

      render("Takbir");
    </script>
  </body>
</html>
