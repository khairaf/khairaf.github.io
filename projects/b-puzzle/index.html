<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PentaBrain - Train Your Brain</title>
    <style>
        :root {
            --bg-color: #fcfdfd;
            --text-color: #495057;
            --accent-mint: #e6fcf5;
            --accent-peach: #fff5f5;
            --accent-lavender: #f3f0ff;
            --accent-blue: #e7f5ff;
            --accent-yellow: #fff9db;
            --correct-color: #51cf66;
            --wrong-color: #ff6b6b;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.03), 0 6px 6px rgba(0, 0, 0, 0.05);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #fff9db 0%, #ffffff 40%),
                        radial-gradient(circle at bottom right, #e7f5ff 0%, #ffffff 40%);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 800px;
            padding: 2.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #4dabf7, #ae3ec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats {
            display: flex;
            gap: 2rem;
            font-weight: 700;
        }

        .stat-item span {
            color: #adb5bd;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 2px;
        }

        .stat-item div {
            font-size: 1.2rem;
            color: #343a40;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2.5rem;
            width: 100%;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #game-board.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 3-2 Layout for 5 items on desktop */
        @media (min-width: 769px) {
            #game-board > :nth-child(4) { grid-column: 1 / span 1.5; justify-self: end; }
            #game-board > :nth-child(5) { grid-column: 2 / span 2; justify-self: start; margin-left: 1.25rem; }
        }

        @media (max-width: 768px) {
            #game-board {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
            #game-board > :nth-child(5) {
                grid-column: 1 / span 2;
                justify-self: center;
            }
            .pentagon-container {
                width: 150px !important;
                height: 150px !important;
            }
            .number-btn {
                font-size: 0.9rem !important;
                width: 32px !important;
                height: 32px !important;
            }
        }

        @media (max-width: 380px) {
            #game-board {
                grid-template-columns: 1fr;
            }
            #game-board > :nth-child(n) {
                grid-column: auto;
            }
        }

        .pentagon-container {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .pentagon-container:hover {
            transform: translateY(-5px) rotate(2deg);
        }

        .pentagon-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.05));
        }

        .pentagon-path {
            fill: white;
            transition: fill 0.4s ease, stroke-width 0.4s ease;
        }

        .pentagon-container.solved .pentagon-path {
            stroke-width: 0;
            filter: drop-shadow(0 0 15px var(--glow-color));
        }

        .number-btn {
            position: absolute;
            background: white;
            border: 2px solid transparent;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-color);
            cursor: pointer;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: var(--transition);
            z-index: 2;
        }

        .number-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .number-btn.wrong {
            animation: shake 0.4s ease;
            background: #fff5f5;
            color: var(--wrong-color);
            border-color: #ffc9c9;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px) rotate(-3deg); }
            40% { transform: translateX(4px) rotate(3deg); }
            60% { transform: translateX(-4px) rotate(-1deg); }
            80% { transform: translateX(4px) rotate(1deg); }
        }

        /* Positioning numbers in pentagon vertices */
        .n0 { top: 12%; left: 50%; transform: translateX(-50%); }
        .n1 { top: 38%; right: 5%; }
        .n2 { bottom: 8%; right: 22%; }
        .n3 { bottom: 8%; left: 22%; }
        .n4 { top: 38%; left: 5%; }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .modal {
            background: white;
            padding: 3.5rem 2.5rem;
            border-radius: 2.5rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 440px;
            width: 90%;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .modal h2 { 
            margin-bottom: 1rem; 
            font-size: 2.5rem; 
            font-weight: 800;
            background: linear-gradient(135deg, #4dabf7, #ae3ec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal p { margin-bottom: 2.5rem; color: #868e96; font-size: 1.1rem; line-height: 1.6; }

        .btn {
            background: #343a40;
            color: white;
            border: none;
            padding: 1.1rem 2rem;
            border-radius: 1.2rem;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            margin-bottom: 0.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            filter: brightness(1.1);
        }

        .btn-op {
            background: #f1f3f5;
            color: #495057;
            margin-bottom: 0 !important;
            padding: 0.7rem 1.2rem !important;
            width: auto !important;
            box-shadow: none;
        }

        .active-op {
            background: linear-gradient(135deg, #4dabf7, #339af0) !important;
            color: white !important;
            box-shadow: 0 4px 12px rgba(51, 154, 240, 0.3) !important;
        }

        .btn-menu {
            align-self: flex-start;
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.8rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 0.5rem;
            width: fit-content;
        }

        .btn-menu:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: translateX(-3px);
        }

        .hidden { display: none !important; }

        footer {
            padding: 2.5rem;
            font-size: 0.9rem;
            color: #adb5bd;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; flex-direction: column;">
            <h1 id="game-title">PentaBrain</h1>
            <button id="menu-btn" class="btn-menu hidden" onclick="resetToMenu()">← Menu</button>
        </div>
        <div class="stats">
            <div class="stat-item"><span id="stat-label-1">Level</span><div id="level-val">1</div></div>
            <div class="stat-item"><span id="stat-label-2">Score</span><div id="score-val">0</div></div>
            <div id="timer-container" class="stat-item hidden"><span>Time</span><div id="timer-val">60</div></div>
        </div>
    </header>

    <main>
        <div id="game-board">
            <!-- 5 Pentagons will be injected here -->
        </div>
    </main>

    <footer id="game-footer">
        Find the number that is the sum of two others in each pentagon.
    </footer>

    <!-- Start Modal -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal">
            <h2>PentaBrain</h2>
            <p>Select your challenge. In each pentagon, find the target number based on the operation.</p>
            
            <div style="margin-bottom: 1.5rem; display: flex; gap: 0.5rem; justify-content: center;">
                <button id="op-sum" class="btn btn-op active-op" onclick="setOp('sum')">Sum (+)</button>
                <button id="op-mult" class="btn btn-op" onclick="setOp('multiply')">Product (×)</button>
            </div>

            <button class="btn" onclick="startGame('levels')">Levels Mode</button>
            <button class="btn" onclick="startGame('time-attack')">Time Attack</button>
            <button class="btn" onclick="startGame('zen')">Zen Mode</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal-overlay hidden">
        <div class="modal">
            <h2 id="finish-title">Finished!</h2>
            <p id="finish-msg">Your brain is sharper already.</p>
            <div id="final-stats" style="margin-bottom: 2rem; font-weight: 700; font-size: 1.5rem;"></div>
            <button class="btn" onclick="resetToMenu()">Main Menu</button>
        </div>
    </div>

    <script>
        // --- State Management ---
        const state = {
            mode: 'levels', // levels, time-attack, zen
            operation: 'sum', // sum, multiply
            level: 1,
            score: 0,
            highScore: localStorage.getItem('pentaSum_highScore') || 0,
            timer: 60,
            timerId: null,
            solvedCount: 0,
            targetCount: 5,
            currentPuzzles: []
        };

        const colors = ['#b2f2bb', '#ffc9c9', '#d0bfff', '#a5d8ff', '#ffec99'];
        const glowColors = ['#51cf66', '#ff8787', '#b197fc', '#4dabf7', '#fcc419'];

        // --- Audio System ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playTone(freq, type = 'sine', duration = 0.1) {
            if (!audioCtx) audioCtx = new AudioCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            correct: () => playTone(880, 'sine', 0.2),
            wrong: () => playTone(220, 'triangle', 0.3),
            complete: () => {
                playTone(523.25, 'sine', 0.1);
                setTimeout(() => playTone(659.25, 'sine', 0.1), 100);
                setTimeout(() => playTone(783.99, 'sine', 0.3), 200);
            }
        };

        // --- UI Setup ---
        function setOp(op) {
            state.operation = op;
            document.querySelectorAll('.btn-op').forEach(b => b.classList.remove('active-op'));
            document.getElementById(op === 'sum' ? 'op-sum' : 'op-mult').classList.add('active-op');
        }

        // --- Logic ---

        function generatePuzzle(difficulty) {
            const isMult = state.operation === 'multiply';
            const range = isMult ? (2 + Math.floor(difficulty/2)) : (5 + (difficulty * 5));
            let a, b, target, d1, d2;

            while (true) {
                if (isMult) {
                    a = Math.floor(Math.random() * (range + 2)) + 2;
                    b = Math.floor(Math.random() * (range + 2)) + 2;
                    target = a * b;
                } else {
                    a = Math.floor(Math.random() * range) + 1;
                    b = Math.floor(Math.random() * range) + 1;
                    target = a + b;
                }
                
                const dRange = isMult ? target * 1.5 : target + range;
                d1 = Math.floor(Math.random() * dRange) + 1;
                d2 = Math.floor(Math.random() * dRange) + 1;

                const set = [a, b, target, d1, d2];
                const unique = new Set(set);
                if (unique.size < 5) continue;

                let relCount = 0;
                for(let i=0; i<5; i++) {
                    for(let j=i+1; j<5; j++) {
                        const val = isMult ? set[i] * set[j] : set[i] + set[j];
                        if (set.includes(val)) relCount++;
                    }
                }

                if (relCount === 1) {
                    return { numbers: shuffle(set), target: target, solved: false };
                }
            }
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function startGame(mode) {
            state.mode = mode;
            state.level = 1;
            state.score = 0;
            state.solvedCount = 0;
            
            document.getElementById('start-modal').classList.add('hidden');
            document.getElementById('timer-container').classList.add('hidden');
            document.getElementById('menu-btn').classList.remove('hidden');
            
            const title = state.operation === 'sum' ? 'PentaSum' : 'PentaProduct';
            const footer = state.operation === 'sum' ? 'sum of two others' : 'multiplication of two others';
            document.getElementById('game-title').innerText = title;
            document.getElementById('game-footer').innerText = `Find the number that is the ${footer} in each pentagon.`;

            if (mode === 'time-attack') {
                state.timer = 60;
                document.getElementById('timer-container').classList.remove('hidden');
                startTimer();
                document.getElementById('stat-label-1').innerText = 'Best';
                document.getElementById('level-val').innerText = state.highScore;
            } else if (mode === 'zen') {
                document.getElementById('stat-label-1').innerText = 'Puzzles';
                document.getElementById('level-val').innerText = '∞';
            } else {
                document.getElementById('stat-label-1').innerText = 'Level';
                document.getElementById('level-val').innerText = state.level;
            }

            updateUI();
            nextLayout();
        }

        function startTimer() {
            clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timer--;
                document.getElementById('timer-val').innerText = state.timer;
                if (state.timer <= 0) endGame();
            }, 1000);
        }

        function nextLayout() {
            state.solvedCount = 0;
            state.currentPuzzles = [];
            const board = document.getElementById('game-board');
            board.classList.remove('active');
            
            setTimeout(() => {
                board.innerHTML = '';
                for (let i = 0; i < state.targetCount; i++) {
                    const puzzle = generatePuzzle(state.level);
                    state.currentPuzzles.push(puzzle);
                    board.appendChild(createPentagon(i, puzzle));
                }
                board.classList.add('active');
            }, 300);
        }

        function createPentagon(index, puzzle) {
            const container = document.createElement('div');
            container.className = 'pentagon-container';
            container.id = `penta-${index}`;
            
            const color = colors[index % colors.length];
            const glow = glowColors[index % glowColors.length];
            container.style.setProperty('--glow-color', glow);

            container.innerHTML = `
                <svg class="pentagon-svg" viewBox="0 0 100 100">
                    <path class="pentagon-path" d="M50 5 L95 38 L78 92 L22 92 L5 38 Z" fill="white" stroke="${color}" stroke-width="3"/>
                </svg>
            `;

            puzzle.numbers.forEach((num, i) => {
                const btn = document.createElement('button');
                btn.className = `number-btn n${i}`;
                btn.innerText = num;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    handleChoice(index, num, btn);
                };
                container.appendChild(btn);
            });

            return container;
        }

        function handleChoice(pentaIdx, num, btn) {
            const puzzle = state.currentPuzzles[pentaIdx];
            if (puzzle.solved) return;

            if (num === puzzle.target) {
                puzzle.solved = true;
                state.solvedCount++;
                state.score += 10 * state.level;
                sounds.correct();
                
                const container = document.getElementById(`penta-${pentaIdx}`);
                container.classList.add('solved');
                container.querySelector('.pentagon-path').style.fill = colors[pentaIdx % colors.length] + 'cc'; // Increased opacity

                updateUI();
                
                if (state.solvedCount === state.targetCount) {
                    handleLevelComplete();
                }
            } else {
                sounds.wrong();
                btn.classList.add('wrong');
                setTimeout(() => btn.classList.remove('wrong'), 400);
                if (state.mode === 'levels') {
                    state.score = Math.max(0, state.score - 5);
                    updateUI();
                }
            }
        }

        function handleLevelComplete() {
            sounds.complete();
            if (state.mode === 'levels') {
                state.level++;
                if (state.level > 10) {
                    endGame("Mastermind!", "You've completed all levels!");
                    return;
                }
            } else if (state.mode === 'time-attack') {
                state.score += 50;
                state.level++;
            } else {
                state.level++;
            }
            
            updateUI();
            setTimeout(nextLayout, 800);
        }

        function updateUI() {
            document.getElementById('score-val').innerText = state.score;
            if (state.mode === 'levels') {
                document.getElementById('level-val').innerText = state.level;
            } else if (state.mode === 'zen') {
                document.getElementById('level-val').innerText = state.level - 1;
            }
        }

        function endGame(title = "Game Over", msg = "Great effort!") {
            clearInterval(state.timerId);
            document.getElementById('menu-btn').classList.add('hidden');
            document.getElementById('game-over-modal').classList.remove('hidden');
            document.getElementById('finish-title').innerText = title;
            document.getElementById('finish-msg').innerText = msg;
            document.getElementById('final-stats').innerText = `Score: ${state.score}`;
            
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('pentaSum_highScore', state.score);
                document.getElementById('finish-msg').innerText = "New High Score!";
            }
        }

        function resetToMenu() {
            clearInterval(state.timerId);
            document.getElementById('menu-btn').classList.add('hidden');
            document.getElementById('game-over-modal').classList.add('hidden');
            document.getElementById('start-modal').classList.remove('hidden');
            document.getElementById('game-board').innerHTML = '';
        }

    </script>
</body>
</html>
